[workspace]
members = [
    "kernel",
    "userspace/init",
    "userspace/libindus",
    "userspace/devmgr",
    "userspace/shell",
    "userspace/logd",
    "userspace/store",
    "userspace/edit",
    "userspace/testsuite",
    "userspace/ais",
    "userspace/net",
]
resolver = "2"

[profile.dev]
panic = "abort"
opt-level = 1
debug = true
overflow-checks = true

[profile.release]
panic = "abort"
opt-level = 3
lto = true
codegen-units = 1
overflow-checks = true
