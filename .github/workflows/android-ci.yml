name: Ind OS CI — Android Build & Contract Verification

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  validate-contracts:
    name: Validate AIDL, GBNF & SELinux Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate XML Permissions
        run: |
          xmlstarlet val vendor/ind/permissions/privapp-permissions-ind.xml || \
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('vendor/ind/permissions/privapp-permissions-ind.xml'); print('XML valid')"

      - name: Check Required Privileged Permissions
        run: |
          grep -q "android.permission.WRITE_SECURE_SETTINGS" vendor/ind/permissions/privapp-permissions-ind.xml
          grep -q "android.permission.MODIFY_PHONE_STATE" vendor/ind/permissions/privapp-permissions-ind.xml
          grep -q "android.permission.BIND_ACCESSIBILITY_SERVICE" vendor/ind/permissions/privapp-permissions-ind.xml
          grep -q "android.permission.CAPTURE_AUDIO_OUTPUT" vendor/ind/permissions/privapp-permissions-ind.xml
          grep -q "android.permission.REAL_GET_TASKS" vendor/ind/permissions/privapp-permissions-ind.xml
          echo "All required privileged permissions present in whitelist."

      - name: Check SELinux Air-Gap Invariant
        run: |
          grep -q "neverallow ind_ai_daemon domain:{ tcp_socket udp_socket rawip_socket netlink_route_socket } \*;" vendor/ind/sepolicy/ind_ai_daemon.te
          echo "Critical Security Invariant: Network socket air-gap verified."

  build-packages:
    name: Build Packages & Assemble Dev Overlay
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission for Gradlew & Harness
        run: |
          chmod +x gradlew
          chmod +x tools/dev-harness/deploy_to_hanoip.sh

      - name: Run Build
        run: ./gradlew assembleDebug --stacktrace

      - name: Test Magisk Module Packaging
        run: ./tools/dev-harness/deploy_to_hanoip.sh

      - name: Upload Module Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ind_os_system_overlay
          path: build/artifacts/ind_os_system_overlay.zip
