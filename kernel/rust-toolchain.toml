# Ind OS Kernel-Track Toolchain Specification
# Phase K0: Mainline Linux Driver Host & TEE Substrate on SM7150-AC (Moto G60 'hanoip')

[toolchain]
channel = "1.82.0"
components = [
    "rustc",
    "cargo",
    "clippy",
    "rustfmt",
    "rust-src",
    "llvm-tools-preview"
]
targets = [
    "aarch64-unknown-none",         # Bare-metal microkernel & TF-A / OP-TEE stubs
    "aarch64-unknown-linux-gnu",    # Mainline Linux userspace / Wayland runtime
    "aarch64-unknown-linux-musl",   # TCB minimal static daemons (Gateway / Exporter)
    "x86_64-unknown-linux-gnu"      # Host simulation & test target
]
profile = "complete"

[env]
RUSTFLAGS = "-C target-cpu=cortex-a76+crypto -C panic=abort -C overflow-checks=on"
CLANG_VERSION = "18.1.8"
BINDGEN_VERSION = "0.70.1"
LLVM_TARGET = "aarch64-linux-gnu"
