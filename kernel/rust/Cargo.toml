[workspace]
members = [
    "crates/ind-core-types",
    "crates/ind-intent-abi",
    "crates/ind-capability",
    "crates/ind-tcb-audit",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
authors = ["Ind OS Engineering Team <team@indos.dev>"]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/sudhanshursingh/ind-os"

[workspace.dependencies]
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
sha2 = { version = "0.10", default-features = false }
zeroize = { version = "1.8", default-features = false, features = ["alloc"] }
