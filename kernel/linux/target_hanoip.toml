# Ind OS Kernel Track - Mainline Linux & Firmware Configuration
# Target Hardware: Motorola Moto G60 (hanoip) / Qualcomm Snapdragon 732G (SM7150-AC)

[target]
codename = "hanoip"
soc = "SM7150-AC"
arch = "aarch64"
cpu_cores = [
    { type = "Kryo 470 Silver (Cortex-A55)", count = 6, max_freq_mhz = 1804 },
    { type = "Kryo 470 Gold (Cortex-A76)", count = 2, max_freq_mhz = 2304 }
]
gpu = "Adreno 618"
dsp = "Hexagon 692 (CDSP/ADSP)"
ram_bytes = 6442450944 # 6.0 GB LPDDR4X

[linux_kernel]
branch = "linux-6.12.y-lts"
source_git = "https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git"
commit = "v6.12.1"
defconfig = "arch/arm64/configs/defconfig"
extra_fragments = [
    "kernel/linux/configs/sm7150_base.config",
    "kernel/linux/configs/ind_ai_sched_ext.config",
    "kernel/linux/configs/ind_security_lsm.config"
]

[trusted_execution]
tf_a_version = "v2.11"
tf_a_repo = "https://github.com/ARM-software/arm-trusted-firmware.git"
optee_os_version = "4.3.0"
optee_os_repo = "https://github.com/OP-TEE/optee_os.git"
optee_client_version = "4.3.0"

[firmware_blobs]
# Note: In accordance with FS-D9, firmware blobs are strictly isolated via SMMU.
# No opaque blobs are placed into the kernel image itself.
vendor_source = "firmware/hanoip"
manifest = "kernel/linux/firmware_manifest.sha256"
